name: Release DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version. Defaults to packages/cli/package.json."
        required: false
        type: string
      create_release:
        description: "Create the git tag and GitHub Release after the DMG builds."
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  actions: write

jobs:
  build-dmg:
    runs-on: macos-26
    env:
      DEVELOPER_ID_APPLICATION_CERT_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT_BASE64 || secrets.APPLE_SIGNING_CERT_BASE64 }}
      DEVELOPER_ID_APPLICATION_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT_PASSWORD || secrets.APPLE_SIGNING_CERT_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
      APP_STORE_CONNECT_KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID || secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID || secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      HUDSON_DEPLOY_KEY: ${{ secrets.HUDSON_DEPLOY_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Resolve release version
        id: version
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
          CREATE_RELEASE: ${{ github.event.inputs.create_release }}
        run: |
          PACKAGE_VERSION="$(sed -n 's/  "version": "\(.*\)",/\1/p' packages/cli/package.json | head -n 1)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            RELEASE_REQUESTED="true"
          else
            VERSION="${REQUESTED_VERSION:-$PACKAGE_VERSION}"
            TAG="v$VERSION"
            RELEASE_REQUESTED="${CREATE_RELEASE:-true}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_requested=$RELEASE_REQUESTED" >> "$GITHUB_OUTPUT"

      - name: Validate release version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CLI_VERSION="$(node -p "require('./packages/cli/package.json').version")"
          SDK_VERSION="$(node -p "require('./packages/client/package.json').version")"
          WEB_CLIENT_VERSION="$(node -p "require('./packages/web-client/package.json').version")"
          SWIFT_VERSION="$(sed -n 's/    public static let current = "\(.*\)"/\1/p' swift/Sources/VoxCore/RuntimePaths.swift)"

          for value in "$CLI_VERSION" "$SDK_VERSION" "$WEB_CLIENT_VERSION" "$SWIFT_VERSION"; do
            if [ "$value" != "$VERSION" ]; then
              echo "::error::Tag v$VERSION does not match package/Swift version $value"
              exit 1
            fi
          done

      - name: Validate release signing config
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
        run: |
          missing=0
          for name in \
            DEVELOPER_ID_APPLICATION_CERT_BASE64 \
            DEVELOPER_ID_APPLICATION_CERT_PASSWORD \
            HUDSON_DEPLOY_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required release secret: $name"
              missing=1
            fi
          done
          if [ -z "$APP_STORE_CONNECT_API_KEY_P8" ] || [ -z "$APP_STORE_CONNECT_KEY_ID" ] || [ -z "$APP_STORE_CONNECT_ISSUER_ID" ]; then
            for name in APPLE_ID APPLE_APP_PASSWORD APPLE_TEAM_ID; do
              if [ -z "${!name}" ]; then
                echo "::error::Missing required notarization config: APP_STORE_CONNECT_API_KEY_P8, APP_STORE_CONNECT_KEY_ID, and APP_STORE_CONNECT_ISSUER_ID; or legacy $name"
                missing=1
              fi
            done
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Import signing certificate
        id: signing
        if: ${{ env.DEVELOPER_ID_APPLICATION_CERT_BASE64 != '' && env.DEVELOPER_ID_APPLICATION_CERT_PASSWORD != '' }}
        run: |
          CERT_PATH="$RUNNER_TEMP/vox-signing.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/vox-signing.keychain-db"
          KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD:-$(uuidgen)}"
          echo "$DEVELOPER_ID_APPLICATION_CERT_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$DEVELOPER_ID_APPLICATION_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(Developer ID Application: .*\)".*/\1/p' | head -n 1)"
          IDENTITY="${IDENTITY:-$APPLE_SIGN_IDENTITY}"
          if [ -z "$IDENTITY" ]; then
            echo "::error::Could not resolve Developer ID Application signing identity from imported certificate"
            exit 1
          fi
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"

      - name: Configure notarytool profile
        id: notary
        run: |
          PROFILE="vox-ci-notarytool"
          if [ -n "$APP_STORE_CONNECT_API_KEY_P8" ] && [ -n "$APP_STORE_CONNECT_KEY_ID" ] && [ -n "$APP_STORE_CONNECT_ISSUER_ID" ]; then
            KEY_PATH="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
            printf '%s\n' "$APP_STORE_CONNECT_API_KEY_P8" > "$KEY_PATH"
            xcrun notarytool store-credentials "$PROFILE" \
              --key-id "$APP_STORE_CONNECT_KEY_ID" \
              --issuer "$APP_STORE_CONNECT_ISSUER_ID" \
              --key "$KEY_PATH"
          elif [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            xcrun notarytool store-credentials "$PROFILE" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --team-id "$APPLE_TEAM_ID"
          else
            echo "::error::Missing notarization config"
            exit 1
          fi
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"

      - name: Configure and validate private SwiftPM access
        run: |
          KEY_PATH="$RUNNER_TEMP/hudson-deploy-key"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$HUDSON_DEPLOY_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          ssh-keyscan -H github.com >> "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"
          cat >> "$HOME/.ssh/config" <<EOF
          Host github.com
            HostName github.com
            User git
            IdentityFile $KEY_PATH
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF
          chmod 600 "$HOME/.ssh/config"
          if ! GIT_TERMINAL_PROMPT=0 git ls-remote --exit-code git@github.com:arach/hudson.git HEAD >/dev/null 2>&1; then
            echo "::error::HUDSON_DEPLOY_KEY cannot read the private arach/hudson repository"
            exit 1
          fi

      - name: Build DMGs
        env:
          VOX_VERSION: ${{ steps.version.outputs.version }}
          VOX_SIGN_IDENTITY: ${{ steps.signing.outputs.identity || env.APPLE_SIGN_IDENTITY }}
          VOX_NOTARY_PROFILE: ${{ steps.notary.outputs.profile }}
          VOX_REQUIRE_SIGNED_RELEASE: ${{ (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && '1' || '' }}
          MINIVOX_VERSION: ${{ steps.version.outputs.version }}
          MINIVOX_SIGN_IDENTITY: ${{ steps.signing.outputs.identity || env.APPLE_SIGN_IDENTITY }}
          MINIVOX_NOTARY_PROFILE: ${{ steps.notary.outputs.profile }}
          MINIVOX_REQUIRE_SIGNED_RELEASE: ${{ (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && '1' || '' }}
          MINIVOX_PUBLISH_SITE_DOWNLOAD: "0"
        run: |
          ./scripts/build-dmg.sh
          ./scripts/build-minivox-dmg.sh

      - name: Upload DMG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Vox-dmgs
          path: |
            dist/Vox.dmg
            dist/minivox/Minivox.dmg

      - name: Create GitHub release and attach DMG
        id: release
        if: ${{ steps.version.outputs.release_requested == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          echo "created_tag=false" >> "$GITHUB_OUTPUT"
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
            echo "created_tag=true" >> "$GITHUB_OUTPUT"
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes
          fi
          gh release upload "$TAG" \
            dist/Vox.dmg \
            dist/minivox/Minivox.dmg \
            --clobber

      - name: Dispatch package publishing workflow
        if: ${{ github.event_name == 'workflow_dispatch' && steps.version.outputs.release_requested == 'true' && steps.release.outputs.created_tag == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish-packages.yml --ref "$GITHUB_REF_NAME"
