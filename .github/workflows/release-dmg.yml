name: Release DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dmg:
    runs-on: macos-26
    env:
      APPLE_SIGNING_CERT_BASE64: ${{ secrets.APPLE_SIGNING_CERT_BASE64 }}
      APPLE_SIGNING_CERT_PASSWORD: ${{ secrets.APPLE_SIGNING_CERT_PASSWORD }}
      APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Resolve release version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          else
            TAG=""
            VERSION="$(sed -n 's/  "version": "\(.*\)",/\1/p' packages/cli/package.json | head -n 1)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate tag version
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CLI_VERSION="$(node -p "require('./packages/cli/package.json').version")"
          SDK_VERSION="$(node -p "require('./packages/client/package.json').version")"
          WEB_CLIENT_VERSION="$(node -p "require('./packages/web-client/package.json').version")"
          SWIFT_VERSION="$(sed -n 's/    public static let current = "\(.*\)"/\1/p' swift/Sources/VoxCore/RuntimePaths.swift)"

          for value in "$CLI_VERSION" "$SDK_VERSION" "$WEB_CLIENT_VERSION" "$SWIFT_VERSION"; do
            if [ "$value" != "$VERSION" ]; then
              echo "::error::Tag v$VERSION does not match package/Swift version $value"
              exit 1
            fi
          done

      - name: Validate release signing config
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          missing=0
          for name in \
            APPLE_SIGNING_CERT_BASE64 \
            APPLE_SIGNING_CERT_PASSWORD \
            APPLE_SIGN_IDENTITY \
            APPLE_ID \
            APPLE_APP_PASSWORD \
            APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required release secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Validate release signing config for manual run
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          missing=0
          for name in \
            APPLE_SIGNING_CERT_BASE64 \
            APPLE_SIGNING_CERT_PASSWORD \
            APPLE_SIGN_IDENTITY \
            APPLE_ID \
            APPLE_APP_PASSWORD \
            APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required release secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Import signing certificate
        if: ${{ env.APPLE_SIGNING_CERT_BASE64 != '' && env.APPLE_SIGNING_CERT_PASSWORD != '' }}
        run: |
          CERT_PATH="$RUNNER_TEMP/vox-signing.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/vox-signing.keychain-db"
          echo "$APPLE_SIGNING_CERT_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_SIGNING_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Configure notarytool profile
        id: notary
        if: ${{ env.APPLE_ID != '' && env.APPLE_APP_PASSWORD != '' && env.APPLE_TEAM_ID != '' }}
        run: |
          PROFILE="vox-ci-notarytool"
          xcrun notarytool store-credentials "$PROFILE" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID"
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"

      - name: Build DMG
        env:
          VOX_VERSION: ${{ steps.version.outputs.version }}
          VOX_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          VOX_NOTARY_PROFILE: ${{ steps.notary.outputs.profile }}
          VOX_REQUIRE_SIGNED_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '' }}
        run: ./scripts/build-dmg.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vox-dmg
          path: dist/Vox.dmg

      - name: Create GitHub release and attach DMG
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes
          fi
          gh release upload "$TAG" dist/Vox.dmg --clobber
