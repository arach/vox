<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" width="780" height="380">
  <style>
    text { font-family: -apple-system, 'SF Pro Text', Helvetica, sans-serif; }
    .label { font-size: 14px; fill: #ccc; font-weight: 600; }
    .sublabel { font-size: 10.5px; fill: #888; }
    .size-label { font-size: 9px; fill: #666; }
    .rec { fill: #e53e3e; }
    .speak { fill: #3b82f6; }
    .note { font-size: 9.5px; fill: #777; font-style: italic; }
  </style>

  <rect width="780" height="380" rx="12" fill="#1a1a1a"/>

  <text x="390" y="24" text-anchor="middle" class="sublabel">Tuning-Fork V — 3 variations</text>

  <!-- ==================== A1: Single Dot (original) ==================== -->
  <text x="130" y="52" text-anchor="middle" class="label">A1: Single Dot</text>
  <text x="130" y="68" text-anchor="middle" class="sublabel">Original — dot centered in the V opening</text>

  <!-- 18x18 -->
  <text x="42" y="90" class="size-label">18x18</text>
  <rect x="36" y="96" width="22" height="22" rx="3" fill="#2a2a2a" stroke="#333" stroke-width="0.5"/>
  <g transform="translate(38, 98)">
    <polyline points="3,4 9,14 15,4" fill="none" stroke="#d4d4d4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="9" cy="5.8" r="1.3" fill="#d4d4d4"/>
  </g>

  <!-- 36x36 -->
  <text x="105" y="90" class="size-label">36x36</text>
  <rect x="90" y="96" width="40" height="40" rx="4" fill="#2a2a2a" stroke="#333" stroke-width="0.5"/>
  <g transform="translate(93, 99)">
    <polyline points="5,7 17,28 29,7" fill="none" stroke="#d4d4d4" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="17" cy="11" r="2.4" fill="#d4d4d4"/>
  </g>

  <!-- 64x64 -->
  <text x="185" y="90" class="size-label">64x64</text>
  <rect x="160" y="96" width="64" height="64" rx="14" fill="#1e1e2e"/>
  <g transform="translate(165, 102)">
    <polyline points="7,10 27,46 47,10" fill="none" stroke="#e0e0e0" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="27" cy="17" r="3.8" fill="#e0e0e0"/>
  </g>

  <!-- Pills -->
  <text x="80" y="188" class="size-label">recording</text>
  <rect x="56" y="196" width="38" height="22" rx="11" class="rec" opacity="0.92"/>
  <g transform="translate(58, 198)">
    <polyline points="5,5 11,15 17,5" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="11" cy="7" r="1.2" fill="white"/>
    <circle cx="28" cy="10" r="3" fill="white"/>
  </g>

  <text x="80" y="232" class="size-label">speaking</text>
  <rect x="56" y="240" width="38" height="22" rx="11" class="speak" opacity="0.92"/>
  <g transform="translate(58, 242)">
    <polyline points="5,5 11,15 17,5" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="11" cy="7" r="1.2" fill="white"/>
    <circle cx="28" cy="10" r="3" fill="white"/>
  </g>

  <text x="130" y="285" text-anchor="middle" class="note">Clean, minimal. Dot = voice source.</text>
  <text x="130" y="298" text-anchor="middle" class="note">Risk: dot may blur at 1x on non-Retina.</text>

  <!-- ==================== A2: Rising Dot ==================== -->
  <text x="390" y="52" text-anchor="middle" class="label">A2: Rising Dot</text>
  <text x="390" y="68" text-anchor="middle" class="sublabel">Dot sits above the V, like sound escaping upward</text>

  <!-- 18x18 -->
  <text x="302" y="90" class="size-label">18x18</text>
  <rect x="296" y="96" width="22" height="22" rx="3" fill="#2a2a2a" stroke="#333" stroke-width="0.5"/>
  <g transform="translate(298, 98)">
    <polyline points="3,6 9,15 15,6" fill="none" stroke="#d4d4d4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="9" cy="3" r="1.3" fill="#d4d4d4"/>
  </g>

  <!-- 36x36 -->
  <text x="365" y="90" class="size-label">36x36</text>
  <rect x="350" y="96" width="40" height="40" rx="4" fill="#2a2a2a" stroke="#333" stroke-width="0.5"/>
  <g transform="translate(353, 99)">
    <polyline points="5,11 17,30 29,11" fill="none" stroke="#d4d4d4" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="17" cy="5.5" r="2.4" fill="#d4d4d4"/>
  </g>

  <!-- 64x64 -->
  <text x="445" y="90" class="size-label">64x64</text>
  <rect x="420" y="96" width="64" height="64" rx="14" fill="#1e1e2e"/>
  <g transform="translate(425, 102)">
    <polyline points="7,16 27,50 47,16" fill="none" stroke="#e0e0e0" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="27" cy="8" r="3.8" fill="#e0e0e0"/>
  </g>

  <!-- Pills -->
  <text x="340" y="188" class="size-label">recording</text>
  <rect x="316" y="196" width="38" height="22" rx="11" class="rec" opacity="0.92"/>
  <g transform="translate(318, 198)">
    <polyline points="5,7 11,16 17,7" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="11" cy="4" r="1.2" fill="white"/>
    <circle cx="28" cy="10" r="3" fill="white"/>
  </g>

  <text x="340" y="232" class="size-label">speaking</text>
  <rect x="316" y="240" width="38" height="22" rx="11" class="speak" opacity="0.92"/>
  <g transform="translate(318, 242)">
    <polyline points="5,7 11,16 17,7" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="11" cy="4" r="1.2" fill="white"/>
    <circle cx="28" cy="10" r="3" fill="white"/>
  </g>

  <text x="390" y="285" text-anchor="middle" class="note">Dot above = sound projection / broadcast.</text>
  <text x="390" y="298" text-anchor="middle" class="note">Stronger vertical read. Feels like an exclamation.</text>

  <!-- ==================== A3: Apex Notch ==================== -->
  <text x="650" y="52" text-anchor="middle" class="label">A3: Apex Notch</text>
  <text x="650" y="68" text-anchor="middle" class="sublabel">Dot at the V apex — voice origin point</text>

  <!-- 18x18 -->
  <text x="562" y="90" class="size-label">18x18</text>
  <rect x="556" y="96" width="22" height="22" rx="3" fill="#2a2a2a" stroke="#333" stroke-width="0.5"/>
  <g transform="translate(558, 98)">
    <!-- V arms stop short of apex, dot fills the junction -->
    <line x1="3" y1="4" x2="7.5" y2="11" stroke="#d4d4d4" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="15" y1="4" x2="10.5" y2="11" stroke="#d4d4d4" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="9" cy="13" r="1.8" fill="#d4d4d4"/>
  </g>

  <!-- 36x36 -->
  <text x="625" y="90" class="size-label">36x36</text>
  <rect x="610" y="96" width="40" height="40" rx="4" fill="#2a2a2a" stroke="#333" stroke-width="0.5"/>
  <g transform="translate(613, 99)">
    <line x1="5" y1="7" x2="13" y2="22" stroke="#d4d4d4" stroke-width="2.8" stroke-linecap="round"/>
    <line x1="29" y1="7" x2="21" y2="22" stroke="#d4d4d4" stroke-width="2.8" stroke-linecap="round"/>
    <circle cx="17" cy="26" r="3.2" fill="#d4d4d4"/>
  </g>

  <!-- 64x64 -->
  <text x="705" y="90" class="size-label">64x64</text>
  <rect x="680" y="96" width="64" height="64" rx="14" fill="#1e1e2e"/>
  <g transform="translate(685, 102)">
    <line x1="7" y1="10" x2="21" y2="36" stroke="#e0e0e0" stroke-width="4.2" stroke-linecap="round"/>
    <line x1="47" y1="10" x2="33" y2="36" stroke="#e0e0e0" stroke-width="4.2" stroke-linecap="round"/>
    <circle cx="27" cy="42" r="5" fill="#e0e0e0"/>
  </g>

  <!-- Pills -->
  <text x="600" y="188" class="size-label">recording</text>
  <rect x="576" y="196" width="38" height="22" rx="11" class="rec" opacity="0.92"/>
  <g transform="translate(578, 198)">
    <line x1="5" y1="5" x2="9" y2="11.5" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="17" y1="5" x2="13" y2="11.5" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="11" cy="14" r="1.8" fill="white"/>
    <circle cx="28" cy="10" r="3" fill="white"/>
  </g>

  <text x="600" y="232" class="size-label">speaking</text>
  <rect x="576" y="240" width="38" height="22" rx="11" class="speak" opacity="0.92"/>
  <g transform="translate(578, 242)">
    <line x1="5" y1="5" x2="9" y2="11.5" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="17" y1="5" x2="13" y2="11.5" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="11" cy="14" r="1.8" fill="white"/>
    <circle cx="28" cy="10" r="3" fill="white"/>
  </g>

  <text x="650" y="285" text-anchor="middle" class="note">Dot replaces apex join — the voice emerges</text>
  <text x="650" y="298" text-anchor="middle" class="note">from the V itself. Most distinctive silhouette.</text>

  <!-- ==================== Comparison strip at bottom ==================== -->
  <rect x="20" y="320" width="740" height="46" rx="8" fill="#222"/>
  <text x="40" y="340" class="size-label">Side-by-side at 18x18:</text>

  <!-- A1 mini -->
  <rect x="160" y="328" width="22" height="22" rx="3" fill="#2a2a2a" stroke="#444" stroke-width="0.5"/>
  <g transform="translate(162, 330)">
    <polyline points="3,4 9,14 15,4" fill="none" stroke="#d4d4d4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="9" cy="5.8" r="1.3" fill="#d4d4d4"/>
  </g>
  <text x="171" y="362" text-anchor="middle" class="size-label">A1</text>

  <!-- A2 mini -->
  <rect x="220" y="328" width="22" height="22" rx="3" fill="#2a2a2a" stroke="#444" stroke-width="0.5"/>
  <g transform="translate(222, 330)">
    <polyline points="3,6 9,15 15,6" fill="none" stroke="#d4d4d4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="9" cy="3" r="1.3" fill="#d4d4d4"/>
  </g>
  <text x="231" y="362" text-anchor="middle" class="size-label">A2</text>

  <!-- A3 mini -->
  <rect x="280" y="328" width="22" height="22" rx="3" fill="#2a2a2a" stroke="#444" stroke-width="0.5"/>
  <g transform="translate(282, 330)">
    <line x1="3" y1="4" x2="7.5" y2="11" stroke="#d4d4d4" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="15" y1="4" x2="10.5" y2="11" stroke="#d4d4d4" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="9" cy="13" r="1.8" fill="#d4d4d4"/>
  </g>
  <text x="291" y="362" text-anchor="middle" class="size-label">A3</text>

  <!-- SF waveform comparison -->
  <text x="380" y="340" class="size-label">vs current SF Symbol:</text>
  <rect x="470" y="328" width="22" height="22" rx="3" fill="#2a2a2a" stroke="#444" stroke-width="0.5"/>
  <g transform="translate(472, 330)">
    <!-- Approximate SF waveform symbol -->
    <line x1="4" y1="7" x2="4" y2="15" stroke="#d4d4d4" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="7" y1="4" x2="7" y2="18" stroke="#d4d4d4" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="10" y1="6" x2="10" y2="16" stroke="#d4d4d4" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="13" y1="3" x2="13" y2="19" stroke="#d4d4d4" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="16" y1="7" x2="16" y2="15" stroke="#d4d4d4" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <text x="481" y="362" text-anchor="middle" class="size-label">current</text>

  <text x="580" y="344" class="note">Recommendation: A3 (most distinctive silhouette)</text>
</svg>
